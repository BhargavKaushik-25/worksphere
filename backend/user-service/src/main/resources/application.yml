spring:
  application:
    name: ${USER_SERVICE_NAME:user-service}
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/worksphere_user}
    username: ${USER_DB_USERNAME:worksphere}
    password: ${USER_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${USER_FLYWAY_ENABLED:true}
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/worksphere_user}
    user: ${USER_DB_USERNAME:worksphere}
    password: ${USER_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${USER_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${USER_JPA_FORMAT_SQL:false}

server:
  port: ${USER_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: ${USER_ACTUATOR_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: ${USER_ACTUATOR_PROBES:true}

logging:
  level:
    root: ${USER_LOG_LEVEL:INFO}
